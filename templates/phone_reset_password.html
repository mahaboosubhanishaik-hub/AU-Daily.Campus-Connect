{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:60vh"><div class="col-md-5 col-lg-4"><div class="card shadow-lg border-0 p-3 rounded-4"><div class="card-body"><div class="text-center mb-4"><h3 class="fw-bold">Set New Password</h3><p class="text-muted small">Your mobile number has been verified.</p></div><form method="POST"><div class="mb-3"><label class="form-label small fw-bold">NEW PASSWORD</label><input type="password" class="form-control bg-light border-0 py-2" name="password" minlength="8" required autofocus></div><div class="mb-4"><label class="form-label small fw-bold">CONFIRM NEW PASSWORD</label><input type="password" class="form-control bg-light border-0 py-2" name="confirm_password" minlength="8" required></div><button class="btn btn-success w-100 rounded-pill py-2">Update Password</button></form></div></div></div></div>
{% endblock %}
