{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 p-3">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 64px; height: 64px;">
                        <i class="fas fa-lock-open fa-lg"></i>
                    </div>
                    <h3 class="fw-bold">Reset Password</h3>
                    <p class="text-muted small">Enter your new password below.</p>
                </div>
                
                <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">NEW PASSWORD</label>
                        <div class="input-group">
                            <input type="password" name="password" class="form-control bg-light border-0 py-2 rounded-3" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">CONFIRM NEW PASSWORD</label>
                        <div class="input-group">
                            <input type="password" name="confirm_password" class="form-control bg-light border-0 py-2 rounded-3" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">Update Password</button>
                </form>
                
                <div class="text-center border-top pt-3">
                    <p class="small"><a href="{{ url_for('student_login') }}" class="text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
