{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 p-3 rounded-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 64px; height: 64px;">
                        <i class="fas fa-lock fa-lg"></i>
                    </div>
                    <h3 class="fw-bold">New Password</h3>
                    <p class="text-muted small">Create a new strong password for your account.</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">NEW PASSWORD</label>
                        <input type="password" name="password" class="form-control bg-light py-2 border-0 rounded-3" placeholder="••••••••" required autofocus>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm_password" class="form-control bg-light py-2 border-0 rounded-3" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2 rounded-pill fw-bold shadow-sm">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
