{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 p-3 rounded-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 64px; height: 64px;">
                        <i class="fas fa-key fa-lg"></i>
                    </div>
                    <h3 class="fw-bold">Forgot Password</h3>
                    <p class="text-muted small">Enter the email registered to your account. We will send a secure reset link that expires in 15 minutes.</p>
                </div>
                
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">REGISTERED EMAIL</label>
                        <input type="email" name="email" class="form-control bg-light py-2 rounded-3 border-0" placeholder="name@example.com" autocomplete="email" required autofocus>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">Send Reset Link</button>
                </form>
                
                <div class="text-center mt-2 border-top pt-3">
                    <a href="{{ url_for('student_login') }}" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
                </div>
                <div class="text-center mt-3">
                    <a href="{{ url_for('phone_recovery') }}" class="small fw-bold text-decoration-none"><i class="fas fa-mobile-screen me-1"></i> Reset using registered mobile number</a>
                </div>
                <div class="text-center mt-2">
                    <a href="{{ url_for('request_admin_recovery') }}" class="small fw-bold text-decoration-none"><i class="fas fa-user-shield me-1"></i> Request administrator assistance</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
