{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:60vh"><div class="col-md-5 col-lg-4"><div class="card shadow-lg border-0 p-3 rounded-4"><div class="card-body"><div class="text-center mb-4"><h3 class="fw-bold">Verify OTP</h3><p class="text-muted small">Enter the code sent to {{ mobile }}.</p></div><form method="POST"><div class="mb-4"><label class="form-label small fw-bold">ONE-TIME PASSWORD</label><input class="form-control bg-light border-0 py-2 text-center fs-4" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required autofocus></div><button class="btn btn-primary w-100 rounded-pill py-2">Verify OTP</button></form><div class="text-center mt-3"><a class="small text-muted text-decoration-none" href="{{ url_for('phone_recovery') }}">Request another OTP</a></div></div></div></div></div>
{% endblock %}
