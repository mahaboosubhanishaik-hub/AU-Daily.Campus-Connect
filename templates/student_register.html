{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 64px; height: 64px;">
                        <i class="fas fa-user-plus fa-lg"></i>
                    </div>
                    <h3 class="fw-bold">Create Account</h3>
                    <p class="text-muted">Join the campus community today</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ps-1">REGISTRATION ID</label>
                            <input type="text" name="student_id" class="form-control bg-light border-0 py-2 rounded-3" placeholder="e.g. 32112345001" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ps-1">FULL NAME</label>
                            <input type="text" name="name" class="form-control bg-light border-0 py-2 rounded-3" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ps-1">EMAIL ADDRESS</label>
                            <input type="email" name="email" class="form-control bg-light border-0 py-2 rounded-3" placeholder="student@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ps-1">PHONE NUMBER</label>
                            <input type="tel" name="phone" class="form-control bg-light border-0 py-2 rounded-3" placeholder="Your Phone Number" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ps-1">DEPARTMENT</label>
                            <select name="department" class="form-select bg-light border-0 py-2 rounded-3" required>
                                <option value="" selected disabled>Select Department</option>
                                {% for dept in departments %}
                                <option value="{{ dept }}">{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ps-1">GRADUATION YEAR</label>
                            <input type="number" name="graduation_year" class="form-control bg-light border-0 py-2 rounded-3" placeholder="e.g. 2026" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted ps-1">PASSWORD</label>
                        <div class="input-group">
                            <input type="password" name="password" id="password" class="form-control bg-light border-0 py-2 rounded-start-3" placeholder="Create a strong password" required>
                            <span class="input-group-text bg-light border-0 rounded-end-3" onclick="togglePassword()" style="cursor: pointer;">
                                <i class="fas fa-eye text-muted" id="toggleIcon"></i>
                            </span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted ps-1">PROFILE PICTURE</label>
                        <input type="file" name="profile_pic" class="form-control bg-light border-0 rounded-3" accept="image/*">
                        <div class="form-text small text-muted ms-1">Upload a clear photo for your ID card (optional).</div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="privacyConsent" name="privacy_consent" value="yes" required>
                        <label class="form-check-label small text-muted" for="privacyConsent">
                            I have read and agree to the <a href="{{ url_for('privacy_policy') }}" target="_blank" class="text-primary fw-bold">Privacy Policy</a>.
                        </label>
                    </div>

                    <div class="d-grid gap-2 mb-4">
                        <button type="submit" class="btn btn-success rounded-pill py-2 fw-bold shadow-sm">Register Account</button>
                    </div>

                    <div class="text-center">
                        <p class="small text-muted">Already have an account? <a href="{{ url_for('student_login') }}" class="text-primary text-decoration-none fw-bold">Sign In</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
