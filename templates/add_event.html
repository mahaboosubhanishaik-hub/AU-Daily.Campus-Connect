{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                        <i class="fas fa-calendar-plus fa-lg"></i>
                    </div>
                    <h3 class="fw-bold">Post New Event</h3>
                    <p class="text-muted">Share an upcoming event with the campus</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted ps-1">EVENT TITLE</label>
                        <input type="text" name="title" class="form-control bg-light border-0 py-2 rounded-3" placeholder="e.g. Annual Tech Symposium" required>
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ps-1">DEPARTMENT</label>
                            <select name="department" class="form-select bg-light border-0 py-2 rounded-3" required>
                                <option value="" selected disabled>Select Dept</option>
                                {% for dept in departments %}
                                <option value="{{ dept }}">{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ps-1">DATE</label>
                            <input type="date" name="date" class="form-control bg-light border-0 py-2 rounded-3" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted ps-1">DESCRIPTION</label>
                        <textarea name="description" class="form-control bg-light border-0 py-2 rounded-3" rows="4" placeholder="Describe the event details..." style="resize: none;" required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted ps-1">EVENT BANNER / VIDEO</label>
                        <div class="input-group">
                            <input type="file" name="image" class="form-control bg-light border-0 rounded-start-3" id="mediaInput" accept="image/*,video/*">
                            <span class="input-group-text bg-light border-0 rounded-end-3 text-muted"><i class="fas fa-cloud-upload-alt"></i></span>
                        </div>
                        <div id="preview-container" class="mt-3 text-center rounded-3 overflow-hidden"></div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold shadow-sm">Publish Event</button>
                        <a href="{{ url_for('main.home') }}" class="btn btn-light rounded-pill py-2 text-muted">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Re-using the preview logic
    document.getElementById('mediaInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        const previewContainer = document.getElementById('preview-container');
        previewContainer.innerHTML = '';
        if (file) {
            const fileType = file.type;
            const fileURL = URL.createObjectURL(file);
            if (fileType.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = fileURL;
                img.className = 'img-fluid rounded shadow-sm';
                img.style.maxHeight = '300px';
                previewContainer.appendChild(img);
            } else if (fileType.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = fileURL;
                video.controls = true;
                video.className = 'img-fluid rounded shadow-sm';
                video.style.maxHeight = '300px';
                previewContainer.appendChild(video);
            }
        }
    });
</script>
{% endblock %}
